# Render Blueprint for the private Cockpit.
# New > Blueprint, select this repo, then set INGEST_TOKEN and either
# BASIC_AUTH_PASS_SHA256 (preferred) or BASIC_AUTH_PASS.
services:
  - type: web
    name: trevor-cockpit
    runtime: python
    plan: starter
    buildCommand: python3 -m compileall -q .
    startCommand: python3 server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATA_DIR
        value: /var/data
      - key: BASIC_AUTH_USER
        value: trevor
      - key: BASIC_AUTH_PASS
        sync: false
      - key: BASIC_AUTH_PASS_SHA256
        sync: false
      - key: INGEST_TOKEN
        sync: false
    disk:
      name: cockpit-data
      mountPath: /var/data
      sizeGB: 1
