<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico">
<title>Cockpit</title>
<style>
:root {
  --bg: #07090d;
  --p: #10161f;
  --l: #243140;
  --t: #e8eef6;
  --m: #b7c3d2;
  --r: #ff6b78;
  --a: #ffc24d;
  --g: #3fe09a;
  --c: #5fe0ff;
  --ech: #3aa0ff;
  --fif: #ff6b78;
  --per: #3fe09a;
  color-scheme: dark;
}
html.light {
  --bg: #f4f7fb;
  --p: #ffffff;
  --l: #cdd6e2;
  --t: #121820;
  --m: #3e4c5e;
  --r: #b42334;
  --a: #8a5a00;
  --g: #0b7a47;
  --c: #0a6e8c;
  --ech: #0a58a6;
  --fif: #b3261e;
  --per: #0b7a47;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(900px 420px at 0% -10%, #123044 0, transparent 55%),
    var(--bg);
  color: var(--t);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
html.light body { background: var(--bg); }
button, a, summary, input, select, textarea { touch-action: manipulation; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
a { color: var(--c); }
header, #status, main { width: min(1120px, 100%); margin: 0 auto; }
header {
  padding: calc(14px + env(safe-area-inset-top)) 16px 8px;
  padding-left: calc(16px + env(safe-area-inset-left));
  padding-right: calc(16px + env(safe-area-inset-right));
}
.top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
h1 { font-size: 20px; letter-spacing: 0.04em; margin: 0; font-weight: 750; }
.mark {
  display: inline-block; width: 12px; height: 12px; margin-right: 8px;
  background: var(--c); box-shadow: 0 0 10px var(--c); vertical-align: baseline;
}
.tools { display: flex; gap: 8px; align-items: center; }
.tool, #theme, #undo {
  min-height: 44px; min-width: 44px; padding: 0 14px;
  border-radius: 22px; border: 1px solid var(--l); background: var(--p);
  color: var(--t); text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
  font-weight: 650; cursor: pointer;
}
#undo[hidden] { display: none; }
.meta { color: var(--m); font-size: 14px; margin: 8px 0 0; }
.fxrow {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 8px;
}
.fxline { color: var(--c); font-size: 14px; margin: 0; font-variant-numeric: tabular-nums; }
.fxline b { font-size: 15px; }
.fxpair { margin-left: 8px; }
.stale-amber { color: var(--a); font-weight: 750; }
.stale-red { color: var(--r); font-weight: 750; }
.fxconv { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0; }
.fxconv label {
  min-width: 0; display: flex; flex-direction: row; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 700;
}
.fxconv input, .fxconv select { width: auto; min-height: 32px; height: 32px; padding: 2px 8px; }
.fxconv input { width: 5.5rem; }
.fxconv output { min-height: 32px; display: inline-flex; align-items: center; font-weight: 750; font-size: 14px; }
.jarvis { border: 1px solid var(--l); border-radius: 12px; padding: 8px 10px; margin: 10px 0 0; background: var(--p); }
.jarvis .lab { display: block; }
.jarvis .fire, .jarvis .decide { margin: 2px 0; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.kpi { border-top: 3px solid var(--m); border-radius: 8px; padding: 6px 8px; background: var(--bg); }
.kpi.red { border-top-color: var(--r); }
.kpi.amber { border-top-color: var(--a); }
.kpi.green { border-top-color: var(--g); }
.kpi .nv { font-size: 18px; }
.home-top, .quad-rest { display: grid; gap: 8px; align-items: start; }
.quad-line { margin: 0; padding: 2px 0; color: var(--m); font-size: 14px; }
.quad { border: 1px solid var(--l); border-radius: 12px; padding: 2px 10px 8px; }
.home-top h2, .quad-rest h2, #calendar h2 { margin-top: 8px; }
.q-do_now { border-color: var(--r); }
.q-schedule { border-color: var(--c); }
.q-delegate { border-color: var(--a); }
.q-delete { border-color: var(--m); }
li.wait.hot { border-left: 3px solid var(--r); padding-left: 8px; }
form.move { display: flex; gap: 8px; align-items: center; }
form.move select { min-height: 44px; }
.clocks {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px; margin-top: 8px;
}
.clk {
  display: flex; flex-direction: column; align-items: flex-start; gap: 0; min-width: 0;
  background: var(--p); border: 1px solid var(--l); border-radius: 10px; padding: 4px 8px;
}
@media (min-width: 720px) {
  .clocks { display: flex; grid-template-columns: none; flex-wrap: nowrap; overflow: visible; }
  .clk {
    flex-direction: row; align-items: baseline; gap: 6px; width: auto;
    border-radius: 999px; padding: 3px 10px;
  }
}
.clk.on { border-color: var(--g); }
.clk.current { border-color: var(--c); }
.clk.current b, .clk.current .role { color: var(--c); }
.clk b { display: inline; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--m); font-weight: 700; }
.ct { display: inline; font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums; margin: 0; }
.cd, .role { display: inline; color: var(--m); font-size: 12px; }
.role { font-weight: 750; }
#status #chips { padding: 0; flex: 1 1 auto; }
#status {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 8px 16px;
  padding-left: calc(16px + env(safe-area-inset-left));
  padding-right: calc(16px + env(safe-area-inset-right));
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
}
#counts { color: var(--m); font-size: 14px; }
#save { font-weight: 750; font-size: 14px; padding: 4px 8px; border-radius: 6px; }
#save.ok { color: var(--g); }
#save.warn { background: var(--a); color: #1a1200; }
main {
  padding: 4px 16px calc(48px + env(safe-area-inset-bottom));
  padding-left: calc(16px + env(safe-area-inset-left));
  padding-right: calc(16px + env(safe-area-inset-right));
}
.banner { background: var(--p); border: 1px solid var(--l); border-radius: 10px; padding: 10px 12px; }
#chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 12px; -webkit-overflow-scrolling: touch; }
.chip {
  flex: none; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid var(--l);
  color: var(--t); text-decoration: none; font-weight: 750; display: inline-flex; align-items: center; justify-content: center;
  white-space: nowrap;
}
@media (max-width: 520px) {
  #chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: visible; }
  .chip { padding: 0 4px; font-size: 14px; }
}
.chip.on { background: var(--t); color: var(--bg); }
.chip[data-area="Echandia"] { border-color: var(--ech); }
.chip[data-area="FiFi4"] { border-color: var(--fif); }
.chip[data-area="Personal"] { border-color: var(--per); }
.chip[data-area="Echandia"].on { background: var(--ech); color: #fff; }
.chip[data-area="FiFi4"].on { background: var(--fif); color: #fff; }
.chip[data-area="Personal"].on { background: var(--per); color: #07140d; }
.bn {
  border: 1px solid var(--r); border-radius: 12px; padding: 14px 16px; margin: 4px 0 16px;
  background: linear-gradient(90deg, #3a0d14, #140a0e);
}
html.light .bn { background: #fff1f2; }
.bn .tag { display: inline; background: transparent; color: var(--r); font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 0; }
.bn p { margin: 6px 0 0; font-size: 18px; }
h2 {
  font-size: 15px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--m);
  border-bottom: 1px solid var(--l); padding-bottom: 6px; margin: 22px 0 8px;
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
h2 small, summary small { font-weight: 550; letter-spacing: 0; text-transform: none; color: var(--m); font-size: 14px; }
h3 { font-size: 13px; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--m); }
h3.place { font-size: 18px; text-transform: none; letter-spacing: 0; color: var(--t); margin: 0 0 6px; }
h3.ah { border-left: 4px solid var(--m); padding-left: 8px; }
.t-echandia { border-left-color: var(--ech); color: var(--ech); }
.t-fifi4 { border-left-color: var(--fif); color: var(--fif); }
.t-personal { border-left-color: var(--per); color: var(--per); }
ul { list-style: none; margin: 0; padding: 0; }
section, details.keep, li.it, h2 { scroll-margin-top: 72px; }
li.it, li.money {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 12px;
  padding: 12px 0; border-bottom: 1px solid var(--l); align-items: start;
}
li.money { grid-template-columns: minmax(0, 1fr); }
li.it form.act { margin: 0; }
.ck {
  min-width: 84px; min-height: 48px; border-radius: 10px; border: 2px solid var(--t);
  background: transparent; color: var(--t); font-weight: 750; cursor: pointer;
}
.ck.em { border-style: dashed; }
.done .ck { background: var(--t); color: var(--bg); }
.bd { min-width: 0; }
.ttl { font-weight: 680; font-size: 18px; overflow-wrap: anywhere; }
.done .ttl { text-decoration: line-through; color: var(--m); }
.it .meta, .money .meta, .card .meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 4px; color: var(--m); font-size: 14px; }
.tag, .b {
  font-size: 12px; font-weight: 750; letter-spacing: 0.04em; text-transform: uppercase;
  border-radius: 4px; padding: 2px 7px;
}
.tag { background: var(--l); color: var(--t); }
.b { background: var(--l); color: var(--t); text-transform: none; letter-spacing: 0; font-size: 13px; }
.b.over { background: var(--r); color: #fff; }
.b.today { background: var(--a); color: #1a1200; }
.b.soon { background: #5a4312; color: #ffe7ad; }
html.light .b.soon { background: #ffe7ad; color: #3d2c00; }
.b.low { color: var(--m); }
.b.now { background: var(--g); color: #04140c; }
.b.next { background: var(--ech); color: #fff; }
.refs, .nt, .src, .attr, .empty, footer, .why { color: var(--m); }
.why {
  font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; min-width: 0; max-width: 100%;
}
.nt { margin-top: 4px; font-size: 15px; }
.note { margin-top: 2px; }
.note > summary {
  display: block; cursor: pointer; min-height: 0; padding: 0; border: 0;
  background: transparent; font-weight: 550; color: var(--m); font-size: 14px;
}
.note > summary::-webkit-details-marker { display: none; }
.noteline { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note[open] .noteline { white-space: normal; }
.rowlinks {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 0;
  margin-top: 2px; font-size: 14px; line-height: 1.35;
}
.rowlinks a { font-weight: 650; text-decoration: none; }
.rowlinks a.draftready { color: var(--a); }
.rowlinks .dot { color: var(--m); }
.rowlinks details { display: inline; }
.rowlinks summary {
  display: inline; cursor: pointer; color: var(--c); font-weight: 650;
  min-height: 0; padding: 0; border: 0; background: transparent;
}
.rowlinks summary::-webkit-details-marker { display: none; }
.qs { list-style: none; margin: 0 0 8px; padding: 0; }
.qs li { border-bottom: 1px solid var(--l); }
.qform { display: flex; gap: 8px; align-items: center; min-height: 44px; margin: 0; }
.qck { min-width: 72px; min-height: 36px; }
.qtext { font-size: 15px; }
.q.done .qtext { color: var(--m); text-decoration: line-through; }
.draftwait { color: var(--a); font-weight: 750; }
#mic {
  position: fixed; z-index: 30; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
  width: 56px; height: 56px; border-radius: 28px; border: 1px solid var(--c);
  background: var(--p); color: var(--c); font-weight: 750; cursor: pointer;
}
#voice {
  position: fixed; z-index: 30; right: 16px; left: 16px; bottom: calc(80px + env(safe-area-inset-bottom));
  max-width: 420px; margin-left: auto;
  background: var(--p); color: var(--t); border: 1px solid var(--l); border-radius: 12px;
  padding: 12px; display: grid; gap: 8px;
}
#voice[hidden] { display: none; }
#voice-modes, #voice-fallback { display: flex; flex-wrap: wrap; gap: 8px; }
#voice button, #voice-text { min-height: 44px; }
#voice-answer { margin: 0; color: var(--m); }
#decisions.dstrip { margin: 0 0 8px; border-bottom: 1px solid var(--l); }
#decisions.dstrip > summary {
  min-height: 36px; display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; font-weight: 700; font-size: 14px; list-style: none;
}
#decisions.dstrip > summary::-webkit-details-marker { display: none; }
.dcard { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 4px 0; }
.dform { margin: 0; }
.dform .btn { min-height: 44px; }
.dnote { color: var(--m); font-size: 13px; margin: 4px 0 8px; }
.lks, .rowtools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.lk {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px;
  border: 1.5px solid var(--c); border-radius: 8px; text-decoration: none; font-weight: 680;
}
.lk.clickup { border-color: #b07cff; color: #d3b6ff; }
html.light .lk.clickup { color: #6936a8; border-color: #6936a8; }
.lk.teams { border-color: #8d86ff; color: #c4c0ff; }
html.light .lk.teams { color: #3d348f; border-color: #3d348f; }
.lk.mail { border-style: dashed; }
.rowtools details { margin: 0; }
details.fold > summary, .btn, .btn.ghost {
  min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--l);
  background: var(--p); cursor: pointer; display: inline-flex; align-items: center; font-weight: 700;
}
.btn { background: var(--t); color: var(--bg); border-color: var(--t); }
.btn.ghost { background: transparent; color: var(--t); }
details.fold form, form.add {
  display: grid; gap: 8px; margin-top: 8px; padding: 10px; border: 1px solid var(--l); border-radius: 10px; background: var(--p);
}
form.add { margin: 12px 0; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--m); font-weight: 700; }
input, select, textarea {
  width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 8px;
  border: 1.5px solid var(--l); background: var(--bg); color: var(--t);
}
textarea { min-height: 72px; }
.watches { margin: 4px 0 14px; }
.watch h2 { margin: 0 0 4px; text-transform: none; letter-spacing: 0; font-size: 18px; color: var(--t); }
.watch h2 a { color: inherit; }
.watch .left { margin: 4px 0; font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; }
.watch .when, .watch .note { margin: 2px 0; color: var(--m); font-size: 14px; }
.watch .status { margin: 8px 0 0; }
.glance { display: grid; gap: 10px; margin: 4px 0 14px; }
.glance-card h2 { margin-top: 0; }
.wxnow { font-size: 20px; font-weight: 750; margin: 4px 0; }
.wxdays { margin: 4px 0 8px; padding-left: 1.1rem; }
.wxdays li { margin: 2px 0; }
.trip, .meet, .up { padding: 8px 0; border-top: 1px solid var(--l); }
.trip:first-of-type, .meet:first-of-type, .up:first-of-type { border-top: 0; }
.van { display: block; color: var(--m); font-size: 13px; font-weight: 550; }
.joinbig { min-height: 48px; width: 100%; justify-content: center; font-size: 17px; background: var(--c); color: #041018; border-color: var(--c); }
.cards, .days, .prg, .nums { display: grid; gap: 10px; }
.card, .day, .num {
  background: var(--p); border: 1px solid var(--l); border-radius: 12px; padding: 12px 14px;
}
.day h3 { margin-top: 0; color: var(--c); text-transform: none; letter-spacing: 0; font-size: 16px; }
.cal { list-style: none; margin: 0; padding: 0; }
.ev { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-top: 1px solid var(--l); }
.tm { font-weight: 750; font-variant-numeric: tabular-nums; }
.tm small { display: block; font-weight: 500; color: var(--m); font-size: 13px; }
.ev.past { opacity: 0.82; }
.ev.stale .et { text-decoration: line-through; color: var(--m); }
.ev.clash { border-left: 3px solid var(--r); padding-left: 8px; }
.money .amt { font-weight: 800; color: var(--t); font-variant-numeric: tabular-nums; }
details.keep { margin-top: 8px; border-top: 1px solid var(--l); }
details.keep > summary {
  min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  cursor: pointer; font-weight: 750; font-size: 18px; list-style: none;
}
details.keep > summary::-webkit-details-marker { display: none; }
details.keep > summary::after { content: "Show"; color: var(--m); font-size: 14px; font-weight: 600; }
details.keep[open] > summary::after { content: "Hide"; }
details.pr { border: 1px solid var(--l); border-radius: 12px; padding: 0 14px 8px; background: var(--p); }
.lab { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--m); margin-bottom: 4px; }
.one { background: var(--p); background: color-mix(in srgb, var(--a) 18%, var(--p)); padding: 8px 10px; border-radius: 8px; }
.card ol, .card ul { margin: 6px 0 8px; padding-left: 1.2rem; }
.card li { margin: 4px 0; }
.nv { font-size: 22px; font-weight: 800; }
footer { margin-top: 28px; font-size: 14px; }
.busy { opacity: 0.45; pointer-events: none; }
@media (min-width: 390px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-width: 720px) {
  body { font-size: 17px; }
  h1 { font-size: 24px; }
  form.add { grid-template-columns: 1fr 160px 170px auto; align-items: end; }
  .cards, .prg, .glance { grid-template-columns: 1fr 1fr; }
  .home-top { grid-template-columns: 1fr 1fr; }
  .quad-rest { grid-template-columns: 1fr 1fr 1fr; }
  .kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .days { grid-template-columns: 1fr 1fr; }
  .nums { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
}
@media (min-width: 1100px) {
  .days { grid-template-columns: 1fr 1fr 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><span class="mark" aria-hidden="true"></span>TREVOR SMALL · COCKPIT</h1>
    <div class="tools">
      <button id="theme" type="button">Light</button>
      <a class="tool" href="/logout">Sign out</a>
    </div>
  </div>
  <!--PRE_JARVIS-->
  <p class="meta <!--PRE_FRESH-->" id="asof"><!--PRE_ASOF--></p>
  <div class="fxrow">
    <!--PRE_FX-->
    <form id="fxconv" class="fxconv" action="#" autocomplete="off">
      <label>Amount<input id="fxamt" type="number" min="0" step="0.01" value="100"></label>
      <label>From<select id="fxfrom"><option>THB</option><option>JPY</option><option>USD</option><option selected>CAD</option></select></label>
      <label>To<select id="fxto"><option>THB</option><option>JPY</option><option selected>USD</option><option>CAD</option></select></label>
      <output id="fxout" for="fxamt">-</output>
    </form>
  </div>
  <script type="application/json" id="fx-rates"><!--PRE_FX_JSON--></script>
  <div class="clocks" id="clocks" data-home-tz="<!--PRE_HOME_TZ-->"><!--PRE_CLOCKS--></div>
</header>
<div id="status">
  <!--PRE_CHIPS-->
  <span id="counts"><!--PRE_COUNTS--></span>
  <span id="save" role="status"></span>
  <button id="undo" type="button" hidden>Undo</button>
</div>
<noscript><p class="banner">Script is off. The buttons on this page still save.</p></noscript>
<main id="app"><!--PRE_MAIN--></main>
<button id="mic" type="button" aria-label="Voice">Mic</button>
<div id="voice" hidden>
  <p id="voice-status">Choose what to say.</p>
  <div id="voice-modes">
    <button type="button" data-mode="reply">Reply to email</button>
    <button type="button" data-mode="task">Add a task</button>
    <button type="button" data-mode="ask">Ask the board</button>
  </div>
  <label id="voice-pick-label" hidden>Email<select id="voice-pick"></select></label>
  <button id="voice-speak" type="button" hidden>Speak</button>
  <form id="voice-fallback" hidden>
    <input id="voice-text" type="text" autocomplete="off" aria-label="Type instead">
    <button type="submit">Send</button>
  </form>
  <p id="voice-answer"></p>
  <button id="voice-close" type="button">Close</button>
</div>
<script>
"use strict";
(function () {
  const byId = (id) => document.getElementById(id);
  const app = byId("app");
  const save = byId("save");
  const undo = byId("undo");
  const params = new URLSearchParams(location.search);
  let area = params.get("area") || "All";
  try { area = params.get("area") || localStorage.getItem("cockpit-area") || "All"; } catch (err) {}
  let lastUndo = null;

  function setSave(kind, text) {
    save.className = kind;
    save.textContent = text;
  }

  async function refresh() {
    const active = document.activeElement;
    if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT")) return;
    const keep = [...app.querySelectorAll("details.keep")].map((node) => node.open);
    const res = await fetch("api/fragment?area=" + encodeURIComponent(area === "All" ? "" : area), {
      cache: "no-store",
      credentials: "same-origin"
    });
    if (!res.ok) throw new Error("refresh");
    const body = await res.json();
    app.innerHTML = body.main;
    byId("counts").textContent = body.counts;
    if (body.jarvis) {
      const strip = byId("jarvis");
      if (strip) strip.outerHTML = body.jarvis;
    }
    app.querySelectorAll("details.keep").forEach((node, index) => {
      if (index < keep.length) node.open = keep[index];
    });
  }

  async function applyArea(next, fallbackHref, chosen) {
    area = next;
    paintChips();
    try { localStorage.setItem("cockpit-area", next); } catch (err) {}
    if (chosen) recordEvent({ type: "filter", area: next });
    try {
      await refresh();
      history.replaceState(null, "", next === "All" ? "./" : "./?area=" + encodeURIComponent(next));
    } catch (err) {
      if (fallbackHref) {
        window.location.assign(fallbackHref);
        return;
      }
      setSave("warn", "The list was not refreshed.");
    }
  }

  function recordEvent(body) {
    post("events", body).catch(function () {
      const frame = document.getElementById("event-frame");
      const target = frame || document.createElement("iframe");
      target.name = "event-frame";
      target.id = "event-frame";
      target.hidden = true;
      if (!frame) document.body.appendChild(target);
      const form = document.createElement("form");
      form.method = "post";
      form.action = "form/events";
      form.target = "event-frame";
      Object.keys(body).forEach(function (key) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = key;
        input.value = body[key] == null ? "" : String(body[key]);
        form.appendChild(input);
      });
      document.body.appendChild(form);
      form.submit();
    });
  }

  async function post(op, body) {
    const res = await fetch("api/" + op, {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error("save");
    return res.json();
  }

  function paintChips() {
    document.querySelectorAll("#chips a.chip").forEach((node) => {
      node.classList.toggle("on", node.dataset.area === area);
    });
  }

  document.addEventListener("click", (ev) => {
    const chip = ev.target.closest("a.chip");
    if (!chip) return;
    ev.preventDefault();
    applyArea(chip.dataset.area, chip.getAttribute("href") || chip.href, true);
  });

  app.addEventListener("click", (ev) => {
    const link = ev.target.closest("a[data-rkind]");
    if (!link || !app.contains(link)) return;
    const body = {
      type: "restaurant",
      label: link.getAttribute("data-rlabel") || "",
      kind: link.getAttribute("data-rkind") || ""
    };
    const placeArea = link.getAttribute("data-rarea") || "";
    const place = link.getAttribute("data-rplace") || "";
    if (placeArea) body.area = placeArea;
    if (place) body.place = place;
    recordEvent(body);
  });

  app.addEventListener("submit", async (ev) => {
    const form = ev.target;
    if (!(form instanceof HTMLFormElement)) return;
    ev.preventDefault();
    const data = new FormData(form);
    const op = (form.getAttribute("action") || "").replace(/^form\//, "");
    let body;
    if (op === "todo/add" || op === "todo/edit") {
      body = {
        id: data.get("id") || undefined,
        title: String(data.get("title") || "").trim(),
        area: data.get("area"),
        due: data.get("due") || "",
        notes: data.get("notes") || ""
      };
      if (!body.title) return;
    } else if (op === "email/handled") {
      body = { id: data.get("id"), handled: data.get("handled") === "1" };
    } else if (op === "todo/quadrant") {
      body = { id: data.get("id"), quadrant: data.get("quadrant") };
    } else if (op === "decision") {
      body = {
        type: data.get("type"),
        target: data.get("target"),
        choice: data.get("choice") || undefined,
        undo: data.get("undo") === "1"
      };
    } else if (op === "snooze") {
      body = {
        id: data.get("id"),
        kind: data.get("kind"),
        until: data.get("until") || "",
        clear: data.get("clear") === "1"
      };
    } else {
      body = { id: data.get("id"), done: data.get("done") === "1" };
    }
    const row = form.closest("li") || form;
    row.classList.add("busy");
    try {
      await post(op, body);
      if (op === "todo/toggle" || op === "email/handled") {
        const inverse = Object.assign({}, body);
        if (op === "todo/toggle") inverse.done = body.done !== true;
        if (op === "email/handled") inverse.handled = body.handled !== true;
        lastUndo = { op: op, body: inverse };
        undo.hidden = false;
      }
      setSave("ok", "Saved");
      await refresh();
    } catch (err) {
      row.classList.remove("busy");
      if (op === "todo/toggle" || op === "email/handled" || op === "todo/quadrant" || op === "question/toggle" || op === "decision" || op === "snooze") {
        form.submit();
        return;
      }
      setSave("warn", "Not saved. Tap again.");
    }
  });

  undo.addEventListener("click", async () => {
    if (!lastUndo) return;
    const job = lastUndo;
    lastUndo = null;
    undo.hidden = true;
    try {
      await post(job.op, job.body);
      setSave("ok", "Undone");
      await refresh();
    } catch (err) {
      setSave("warn", "Undo did not save. Use the button on the item.");
    }
  });

  function tick() {
    const now = new Date();
    document.querySelectorAll(".clk").forEach((node) => {
      const zone = node.dataset.tz;
      try {
        const time = new Intl.DateTimeFormat("en-US", { timeZone: zone, hour: "numeric", minute: "2-digit" }).format(now);
        const day = new Intl.DateTimeFormat("en-US", { timeZone: zone, weekday: "short", month: "short", day: "numeric" }).format(now);
        const hour = Number(new Intl.DateTimeFormat("en-US", { timeZone: zone, hour: "numeric", hourCycle: "h23" }).format(now));
        const weekday = new Intl.DateTimeFormat("en-US", { timeZone: zone, weekday: "short" }).format(now);
        node.querySelector(".ct").textContent = time;
        node.querySelector(".cd").textContent = day;
        node.classList.toggle("on", hour >= 8 && hour < 18 && weekday !== "Sat" && weekday !== "Sun");
      } catch (err) {}
    });
  }

  function deviceZone() {
    let detected = "";
    try { detected = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (err) { return ""; }
    const upper = detected.toUpperCase();
    if (!detected || upper === "UTC" || upper === "ETC/UTC" || upper === "ETC/GMT" || upper === "GMT") return "";
    try {
      Intl.DateTimeFormat("en-US", { timeZone: detected }).format(new Date());
    } catch (err) {
      return "";
    }
    return detected;
  }

  function zoneCity(zone) {
    return (zone.split("/").pop() || zone).replace(/_/g, " ");
  }

  function setClockRole(node, text) {
    let role = node.querySelector(".role");
    if (!text) {
      if (role) role.remove();
      return;
    }
    if (!role) {
      role = document.createElement("span");
      role.className = "role";
      node.appendChild(role);
    }
    role.textContent = text;
  }

  function roleList(node) {
    return (node.dataset.role || "").split(/\s+/).filter(Boolean);
  }

  function ensureDeviceClock() {
    const box = byId("clocks");
    if (!box) return;
    const detected = deviceZone();
    if (!detected) return;
    const chips = () => [...box.querySelectorAll(".clk")];

    function releaseHere(node) {
      const roles = roleList(node).filter((role) => role !== "here");
      node.classList.remove("current");
      if (!roles.length) {
        node.remove();
        return;
      }
      node.dataset.role = roles.join(" ");
      if (roles.includes("home")) setClockRole(node, "Home");
      else setClockRole(node, "");
    }

    const match = chips().find((node) => node.dataset.tz === detected);
    if (match) {
      chips().forEach((node) => {
        if (node !== match && roleList(node).includes("here")) releaseHere(node);
      });
      const roles = new Set(roleList(match));
      roles.add("here");
      match.dataset.role = [...roles].join(" ");
      match.classList.add("current");
      setClockRole(match, "Here");
      chips().forEach((node) => {
        if (node !== match) node.classList.remove("current");
      });
      return;
    }

    chips().forEach((node) => {
      if (roleList(node).includes("here")) releaseHere(node);
    });
    const card = document.createElement("div");
    card.className = "clk current";
    card.dataset.tz = detected;
    card.dataset.role = "here";
    const name = document.createElement("b");
    name.textContent = zoneCity(detected);
    const time = document.createElement("span");
    time.className = "ct";
    const day = document.createElement("span");
    day.className = "cd";
    const role = document.createElement("span");
    role.className = "role";
    role.textContent = "Here";
    card.append(name, time, day, role);
    box.insertBefore(card, box.firstChild);
  }
  ensureDeviceClock();
  tick();
  setInterval(tick, 30000);

  function fxTable() {
    try { return JSON.parse(byId("fx-rates").textContent || "{}"); } catch (err) { return {}; }
  }
  function convertFx() {
    const table = fxTable();
    const cad = table.cad_per || {};
    const amount = Number(byId("fxamt").value);
    const from = byId("fxfrom").value;
    const to = byId("fxto").value;
    const out = byId("fxout");
    if (!amount || !cad[from] || !cad[to]) {
      out.textContent = "Rate unavailable";
      return;
    }
    const value = amount * cad[from] / cad[to];
    out.textContent = value.toLocaleString("en-CA", { maximumFractionDigits: 2 }) + " " + to;
  }
  ["fxamt", "fxfrom", "fxto"].forEach((id) => {
    const node = byId(id);
    if (node) node.addEventListener("input", convertFx);
  });
  convertFx();

  fetch("https://www.bankofcanada.ca/valet/observations/FXUSDCAD/json?recent=1", { credentials: "same-origin" })
    .then((res) => { if (!res.ok) throw new Error("fx"); return res.json(); })
    .then((payload) => {
      const obs = payload.observations || [];
      const latest = obs[obs.length - 1];
      const rate = Number(latest && latest.FXUSDCAD && latest.FXUSDCAD.v);
      if (!rate) throw new Error("fx");
      byId("fxr").textContent = rate.toFixed(4);
      byId("fxd").textContent = latest.d;
      byId("fxs").textContent = "Bank of Canada Valet, live";
      const table = fxTable();
      table.cad_per = table.cad_per || {};
      table.cad_per.USD = rate;
      table.cad_per.CAD = 1;
      byId("fx-rates").textContent = JSON.stringify(table);
      convertFx();
    })
    .catch(() => {});

  const root = document.documentElement;
  const themeButton = byId("theme");
  let stored = null;
  try { stored = localStorage.getItem("cockpit-theme"); } catch (err) {}
  if (stored === "light") root.classList.add("light");
  function paintTheme() {
    const light = root.classList.contains("light");
    themeButton.textContent = light ? "Dark" : "Light";
    const theme = document.querySelector('meta[name="theme-color"]');
    if (theme) theme.setAttribute("content", light ? "#f4f7fb" : "#07090d");
  }
  paintTheme();
  themeButton.addEventListener("click", () => {
    root.classList.toggle("light");
    try { localStorage.setItem("cockpit-theme", root.classList.contains("light") ? "light" : "dark"); } catch (err) {}
    paintTheme();
  });

  if ((params.get("area") || "All") !== area) {
    applyArea(area, area === "All" ? "./" : "./?area=" + encodeURIComponent(area));
  }
  function paintWatches() {
    const narrow = window.matchMedia("(max-width: 520px)").matches;
    document.querySelectorAll(".watch .left[data-deadline]").forEach((node) => {
      const end = Date.parse(node.getAttribute("data-deadline"));
      if (!Number.isFinite(end)) return;
      const left = end - Date.now();
      if (left <= 0) {
        node.textContent = "Target reached, checking status";
        return;
      }
      const whole = Math.floor(left / 1000);
      const days = Math.floor(whole / 86400);
      const hours = Math.floor((whole % 86400) / 3600);
      const mins = Math.floor((whole % 3600) / 60);
      const secs = whole % 60;
      const parts = [];
      if (days) parts.push(days + "d");
      parts.push(hours + "h");
      parts.push(mins + "m");
      if (!narrow) parts.push(secs + "s");
      node.textContent = parts.join(" ");
    });
  }
  paintWatches();
  setInterval(paintWatches, 1000);
  setInterval(() => { refresh().catch(() => setSave("warn", "Offline. Showing the last page.")); }, 60000);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    refresh().catch(() => {});
  });

  const mic = byId("mic");
  const voiceBox = byId("voice");
  const voiceStatus = byId("voice-status");
  const voiceAnswer = byId("voice-answer");
  const voiceFallback = byId("voice-fallback");
  const voiceText = byId("voice-text");
  const voicePickLabel = byId("voice-pick-label");
  const voicePick = byId("voice-pick");
  const voiceSpeak = byId("voice-speak");
  let voiceMode = "";
  let voiceItem = "";

  function unlockSpeech() {
    if (!window.speechSynthesis) return;
    const utter = new SpeechSynthesisUtterance(" ");
    utter.volume = 0;
    window.speechSynthesis.speak(utter);
  }

  function speak(text) {
    voiceAnswer.textContent = text;
    if (!window.speechSynthesis) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    window.speechSynthesis.speak(utter);
  }

  function showFallback(message) {
    voiceStatus.textContent = message || "Speech is off. Type instead. The keyboard mic still works.";
    voiceFallback.hidden = false;
    voiceText.focus();
  }

  function emailChoices() {
    return [...document.querySelectorAll("li.it")].filter((row) => row.querySelector('form[action="form/email/handled"]')).map((row) => ({
      id: row.dataset.id || "",
      title: (row.querySelector(".ttl") && row.querySelector(".ttl").textContent) || "Email"
    })).filter((row) => row.id);
  }

  function fillEmailPick() {
    const choices = emailChoices();
    voicePick.innerHTML = "";
    choices.forEach((choice) => {
      const option = document.createElement("option");
      option.value = choice.id;
      option.textContent = choice.title;
      if (choice.id === voiceItem) option.selected = true;
      voicePick.appendChild(option);
    });
    return choices;
  }

  function startListen(onText) {
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Rec) {
      showFallback();
      return;
    }
    let rec;
    try { rec = new Rec(); } catch (err) { showFallback(); return; }
    rec.lang = "en-US";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = (ev) => {
      const said = ev.results && ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript;
      if (said) onText(String(said));
      else showFallback();
    };
    rec.onerror = () => showFallback();
    try { rec.start(); } catch (err) { showFallback(); }
  }

  async function useText(text) {
    const said = String(text || "").trim();
    if (!said) return;
    voiceStatus.textContent = "Working.";
    try {
      if (voiceMode === "ask") {
        const res = await post("voice/ask", { text: said });
        speak((res && res.answer) || "I can't answer that from the board yet.");
        voiceStatus.textContent = "Answered.";
      } else if (voiceMode === "task") {
        await post("todo/add", { title: said.slice(0, 300), area: "Personal", due: "", notes: "" });
        voiceStatus.textContent = "Added to the board.";
        await refresh();
      } else if (voiceMode === "reply") {
        const itemId = voicePick.value || voiceItem;
        if (!itemId) {
          voiceStatus.textContent = "No email is selected.";
          return;
        }
        await post("voice/draft_request", { item_id: itemId, text: said });
        voiceStatus.textContent = "Draft requested.";
        await refresh();
      }
    } catch (err) {
      voiceStatus.textContent = "Not saved. Tap again.";
    }
  }

  function begin(mode) {
    unlockSpeech();
    voiceMode = mode;
    voiceAnswer.textContent = "";
    voiceFallback.hidden = true;
    voiceSpeak.hidden = true;
    voicePickLabel.hidden = true;
    if (mode === "reply") {
      const choices = fillEmailPick();
      if (!choices.length) {
        voiceStatus.textContent = "No email is on the board.";
        return;
      }
      if (voiceItem && choices.some((choice) => choice.id === voiceItem)) {
        voiceStatus.textContent = "Listening for the reply.";
        startListen(useText);
        return;
      }
      voicePickLabel.hidden = false;
      voiceSpeak.hidden = false;
      voiceStatus.textContent = "Choose the email, then speak.";
      return;
    }
    voiceStatus.textContent = mode === "ask" ? "Listening for a question." : "Listening for a task.";
    startListen(useText);
  }

  mic.addEventListener("click", () => {
    unlockSpeech();
    voiceBox.hidden = false;
    voiceStatus.textContent = voiceItem ? "Reply is ready for the email you opened." : "Choose what to say.";
  });
  byId("voice-close").addEventListener("click", () => { voiceBox.hidden = true; });
  voiceBox.querySelectorAll("[data-mode]").forEach((button) => {
    button.addEventListener("click", () => begin(button.dataset.mode));
  });
  voiceSpeak.addEventListener("click", () => {
    unlockSpeech();
    voiceItem = voicePick.value || voiceItem;
    voiceStatus.textContent = "Listening for the reply.";
    startListen(useText);
  });
  voiceFallback.addEventListener("submit", (ev) => {
    ev.preventDefault();
    unlockSpeech();
    useText(voiceText.value);
  });
  app.addEventListener("click", (ev) => {
    const row = ev.target.closest("li.it");
    if (!row || !row.querySelector('form[action="form/email/handled"]')) return;
    voiceItem = row.dataset.id || "";
  });
})();
</script>
</body>
</html>
